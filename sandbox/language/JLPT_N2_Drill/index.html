<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="10">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JLPT N2 Drill Random Selector</title>

    <script>

        // -----------------------------
        // JLPT N2 Random Selector
        // Version 0.1
        // -----------------------------

        const drills = [

            "jlpt_n2_drill_0.html",
            "jlpt_n2_drill_1.html",
            "jlpt_n2_drill_2.html",
            "jlpt_n2_drill_3.html",
            "jlpt_n2_drill_4.html",
            "jlpt_n2_drill_5.html",
            "jlpt_n2_drill_6.html",
            "jlpt_n2_drill_7.html",
            "jlpt_n2_drill_8.html",
            "jlpt_n2_drill_9.html",
            "jlpt_n2_drill_10.html"

        ];

        function randomJump() {

            const randomIndex = Math.floor(Math.random() * drills.length);

            window.location.href = drills[randomIndex];

        }

        window.onload = randomJump;

    </script>

</head>

<body>

<h2>Loading...</h2>

<p>Random Drill is starting.</p>

</body>
</html>
