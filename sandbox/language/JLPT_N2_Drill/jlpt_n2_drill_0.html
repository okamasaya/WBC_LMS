<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JLPT N2 語彙 演習システム</title>
    
    
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="toast-message" class="toast"></div>

<div id="start-container" class="start-screen">
    <div class="start-title" id="title-display">JLPT N2 語彙 演習システム</div>
    <div class="start-info" id="description-display"></div>
    
    <div style="margin-bottom: 25px; text-align: center;">
        <div style="background: #f8fafc; padding: 15px; border-radius: 6px; border: 1px solid #e2e8f0; display: inline-block; text-align: left; margin: 5px;">
            <label for="question-count-select" style="font-weight: bold; margin-right: 10px; color: #475569;">出題問題数:</label>
            <select id="question-count-select" style="padding: 8px 16px; font-size: 15px; border-radius: 6px; border: 1px solid #cbd5e1; background: white; cursor: pointer;">
                <option value="all" selected>全問出題</option>
                <option value="10">10問</option>
                <option value="20">20問</option>
                <option value="30">30問</option>
                <option value="50">50問</option>
            </select>
        </div>
        
        <div id="category-select-container" style="background: #f8fafc; padding: 15px; border-radius: 6px; border: 1px solid #e2e8f0; display: none; text-align: left; margin: 5px;">
            <label for="category-select" style="font-weight: bold; margin-right: 10px; color: #475569;">出題カテゴリ:</label>
            <select id="category-select" style="padding: 8px 16px; font-size: 15px; border-radius: 6px; border: 1px solid #cbd5e1; background: white; cursor: pointer;">
                <option value="all" selected>全カテゴリ</option>
            </select>
        </div>
    </div>
    <button class="nav-btn submit-btn" style="width: 100%; font-size: 18px; background-color: #1e3a8a;" onclick="startExam()">演習を開始する</button>
</div>

<div class="container" id="exam-container" style="display: none;">
    <div class="main-panel">
        <div class="header-area">
            <h1 id="progress">問題 1 / --</h1>
            <div class="timer-display" id="timer">00:00</div>
        </div>

        <div class="question-box">
            <div id="category-display" class="category-tag">【カテゴリ】</div>
            <div class="question" id="question-text">読み込み中...</div>
            <div id="options-container"></div>
            
            <div id="confidence-panel" class="confidence-panel">
                <div class="confidence-title">回答に対する自信度を4段階から選択してください</div>
                <div class="confidence-grid">
                    <button class="conf-btn" onclick="selectConfidence(1)">1. 自信がある</button>
                    <button class="conf-btn" onclick="selectConfidence(2)">2. 少し自信がある</button>
                    <button class="conf-btn" onclick="selectConfidence(3)">3. 怪しい</button>
                    <button class="conf-btn" onclick="selectConfidence(4)">4. 直感！</button>
                </div>
            </div>

            <div id="instant-feedback" class="feedback-panel"></div>
        </div>

        <div class="control-box">
            <button class="nav-btn" onclick="prevQuestion()">前の問題へ</button>
            <button class="flag-btn" id="flag-button" onclick="toggleFlag()">🚩 あとで確認</button>
            <button class="nav-btn" id="next-button" onclick="nextQuestion()">次の問題へ</button>
        </div>
    </div>

    <div class="side-panel" id="sidebar-panel">
        <div class="palette-title">問題一覧</div>
        <div class="palette-grid" id="palette-grid"></div>
        <hr style="border: 0; border-top: 1px solid #e2e8f0; width: 100%; margin: 10px 0;">
        <button class="nav-btn submit-btn" id="finish-btn" style="width: 100%; margin: 0;" onclick="submitExam(false)">演習を終了して採点</button>
    </div>
</div>

<div class="container" id="score-container" style="display: none;">
    <div class="score-screen" style="display: block;">
        <h1>演習結果</h1>
        <div class="score-num" id="final-score">0 / --</div>

        <h2>正誤と解説の確認・理解度チェック</h2>
        <p style="color: #4a5568; font-size: 14px;">解説を確認し、理解度ボタンを選択してください。</p>
        <div id="review-list"></div>

        <div style="margin-top: 40px; padding: 25px; background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 10px;">
            <h3 style="margin-top:0; color: #1e3a8a;">演習ログの確定とレポート出力</h3>
            <p style="color: #4a5568; font-size: 14px; margin-bottom: 15px;">
                解説の理解度選択が完了したら、以下のボタンを押して分析レポートおよび各種ログデータを確定生成してください。
            </p>
            
            <button class="nav-btn" style="background-color: #1e3a8a; width: 100%; padding: 14px; font-size: 16px;" onclick="finalizeAndGenerateReport()">
                📊 レポート・ログデータを確定して生成
            </button>

            <div id="output-section" style="display: none; margin-top: 25px;">
                <div class="action-btn-group">
                    <button class="nav-btn" style="background-color: #2b6cb0; flex: 1; min-width: 180px; padding: 12px;" onclick="copyReport()">AIレポートをコピー</button>
                    <button class="nav-btn" style="background-color: #16a34a; flex: 1; min-width: 180px; padding: 12px;" onclick="downloadExcelCSV()">統合結果CSV(GAS/Excel用)</button>
                    <button class="nav-btn" style="background-color: #0d9488; flex: 1; min-width: 180px; padding: 12px;" onclick="downloadRDBAnswerLogCSV()">AnswerLog.csv (RDB用)</button>
                    <button class="nav-btn" style="background-color: #4f46e5; flex: 1; min-width: 180px; padding: 12px;" onclick="downloadRDBSessionLogCSV()">SessionLog.csv (RDB用)</button>
                </div>
                
                <textarea id="report-text" class="report-area" readonly></textarea>
            </div>
        </div>

        <button class="nav-btn" onclick="restartDrill()" style="background-color: #718096; width: 100%; padding: 12px; margin-top: 25px;">もう一度最初から挑戦する</button>
    </div>
</div>

の","isCorrect":true,"rationale":"「本当の」という意味（いみ）を表（あらわ）す接頭語（せっとうご）は「真（しん）」です。「真（しん）の原因（げんいん）」で「本当の理由（りゆう）」という意味（いみ）になります。<br>「未（み）」はまだ〜ない、「無（む）」は無い、「非（ひ）」は〜ではないという意味（いみ）を作るため不適切（ふてきせつ）です。"},{"text":"未の","isCorrect":false,"rationale":"「本当の」という意味（いみ）を表（あらわ）す接頭語（せっとうご）は「真（しん）」です。「真（しん）の原因（げんいん）」で「本当の理由（りゆう）」という意味（いみ）になります。<br>「未（み）」はまだ〜ない、「無（む）」は無い、「非（ひ）」は〜ではないという意味（いみ）を作るため不適切（ふてきせつ）です。"},{"text":"無の","isCorrect":false,"rationale":"「本当の」という意味（いみ）を表（あらわ）す接頭語（せっとうご）は「真（しん）」です。「真（しん）の原因（げんいん）」で「本当の理由（りゆう）」という意味（いみ）になります。<br>「未（み）」はまだ〜ない、「無（む）」は無い、「非（ひ）」は〜ではないという意味（いみ）を作るため不適切（ふてきせつ）です。"},{"text":"非の","isCorrect":false,"rationale":"「本当の」という意味（いみ）を表（あらわ）す接頭語（せっとうご）は「真（しん）」です。「真（しん）の原因（げんいん）」で「本当の理由（りゆう）」という意味（いみ）になります。<br>「未（み）」はまだ〜ない、「無（む）」は無い、「非（ひ）」は〜ではないという意味（いみ）を作るため不適切（ふてきせつ）です。"}]},{"id":"JLPT_N1_006","category":"【文法】文法形式の判断","question":"長年の夢だったオリンピック出場を果たし、喜びの______です。","options":[{"text":"至り","isCorrect":true,"rationale":"「〜の至（いた）り」は「最高（さいこう）に〜だ（感情（かんじょう）が一番強い）」という意味（いみ）の硬（かた）い表現（ひょうげん）です。「喜び（よろこび）の至（いた）り」はよく使う形です。<br>「〜の極（きわ）み」も似た意味（いみ）ですが、「贅沢（ぜいたく）の極み」などに使（つか）います。「〜を限（かぎ）りに」は最後（さいご）に、「〜上（うえ）」は〜した結果という意味（いみ）です。"},{"text":"極み","isCorrect":false,"rationale":"「〜の至（いた）り」は「最高（さいこう）に〜だ（感情（かんじょう）が一番強い）」という意味（いみ）の硬（かた）い表現（ひょうげん）です。「喜び（よろこび）の至（いた）り」はよく使う形です。<br>「〜の極（きわ）み」も似た意味（いみ）ですが、「贅沢（ぜいたく）の極み」などに使（つか）います。「〜を限（かぎ）りに」は最後（さいご）に、「〜上（うえ）」は〜した結果という意味（いみ）です。"},{"text":"限り","isCorrect":false,"rationale":"「〜の至（いた）り」は「最高（さいこう）に〜だ（感情（かんじょう）が一番強い）」という意味（いみ）の硬（かた）い表現（ひょうげん）です。「喜び（よろこび）の至（いた）り」はよく使う形です。<br>「〜の極（きわ）み」も似た意味（いみ）ですが、「贅沢（ぜいたく）の極み」などに使（つか）います。「〜を限（かぎ）りに」は最後（さいご）に、「〜上（うえ）」は〜した結果という意味（いみ）です。"},{"text":"上","isCorrect":false,"rationale":"「〜の至（いた）り」は「最高（さいこう）に〜だ（感情（かんじょう）が一番強い）」という意味（いみ）の硬（かた）い表現（ひょうげん）です。「喜び（よろこび）の至（いた）り」はよく使う形です。<br>「〜の極（きわ）み」も似た意味（いみ）ですが、「贅沢（ぜいたく）の極み」などに使（つか）います。「〜を限（かぎ）りに」は最後（さいご）に、「〜上（うえ）」は〜した結果という意味（いみ）です。"}]},{"id":"JLPT_N1_007","category":"【文法】文法形式の判断","question":"この美術館は、現代アートの展示______、世界有数の規模を誇る。","options":[{"text":"にかけては","isCorrect":true,"rationale" <script>
const appConfig = JSON.parse(document.getElementById("raw-config").textContent);
const originalQuizData = JSON.parse(document.getElementById("raw-questions").textContent);

let quizData = [];
let currentQuestionIndex = 0;
let userAnswers = {}; 
let flaggedQuestions = {};
let timerInterval = null;
let timeRemaining = 0;
let examStartTime = 0;
let examEndTime = 0;
let qStartTime = 0; 
let reportBaseText = "";
let rawLogArray = [];
let actualSummary = {};

function showToast(message) {
    const toast = document.getElementById("toast-message");
    toast.innerText = message;
    toast.style.display = "block";
    setTimeout(() => { toast.style.opacity = "1"; }, 10);
    setTimeout(() => {
        toast.style.opacity = "0";
        setTimeout(() => { toast.style.display = "none"; }, 300);
    }, 2500);
}

function startExamTimer() {
    if (timerInterval) clearInterval(timerInterval);
    updateTimerDisplay();
    timerInterval = setInterval(() => {
        timeRemaining--;
        updateTimerDisplay();
        if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            showToast("制限時間になりました。自動的に採点を行います。");
            setTimeout(() => { submitExam(true); }, 1500);
        }
    }, 1000);
}

function updateTimerDisplay() {
    const minutes = Math.floor(timeRemaining / 60);
    const seconds = timeRemaining % 60;
    document.getElementById("timer").innerText = 
        `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
}

function formatText(text) {
    if (text === null || text === undefined || text === "") return "";
    let escaped = String(text)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    
    escaped = escaped.replace(/&lt;br\s*\/?&gt;/gi, "<br>")
        .replace(/&lt;u&gt;/gi, "<u>").replace(/&lt;\/u&gt;/gi, "</u>")
        .replace(/&lt;b&gt;/gi, "<b>").replace(/&lt;\/b&gt;/gi, "</b>")
        .replace(/&lt;strong&gt;/gi, "<strong>").replace(/&lt;\/strong&gt;/gi, "</strong>")
        .replace(/\n/g, "<br>");
    return escaped;
}

function generateCategoryOptions() {
    const categorySelect = document.getElementById("category-select");
    const categories = originalQuizData.map(q => q.category ? q.category.toString() : "未分類");
    const uniqueCategories = [...new Set(categories)].filter(Boolean).sort();
    
    uniqueCategories.forEach(cat => {
        const option = document.createElement("option");
        option.value = cat;
        option.textContent = cat;
        categorySelect.appendChild(option);
    });
}

function updateElapsedTimeForCurrentQuestion() {
    if (quizData.length === 0 || currentQuestionIndex < 0 || qStartTime === 0) return;
    
    if (appConfig.mode === "mock" || (appConfig.mode === "practice" && !userAnswers[currentQuestionIndex]?.isConfirmed)) {
        const elapsedMs = Date.now() - qStartTime;
        
        if (!userAnswers[currentQuestionIndex]) {
            userAnswers[currentQuestionIndex] = { selectedOption: null, elapsedTimeMs: 0, confidence: "NULL", isConfirmed: false, answerTimestamp: null };
        }
        userAnswers[currentQuestionIndex].elapsedTimeMs += elapsedMs;
    }
    qStartTime = Date.now();
}

window.onload = function() {
    if (appConfig.mode === "practice") {
        document.getElementById("description-display").innerHTML = "一問一答（Drill）形式の演習です。解答選択後に自信度を入力すると、その場で解説が表示されます。<br>（制限時間なし・解説読込時間は回答時間に含みません）";
        document.getElementById("timer").style.display = "none";
        document.getElementById("sidebar-panel").style.display = "none";
        document.getElementById("flag-button").style.display = "none";
        document.getElementById("category-select-container").style.display = "inline-block";
        generateCategoryOptions();
        
        const ctrlBox = document.querySelector(".control-box");
        const pBtn = document.createElement("button");
        pBtn.className = "nav-btn submit-btn";
        pBtn.innerText = "演習を終了して採点";
        pBtn.onclick = function() { submitExam(false); };
        ctrlBox.appendChild(pBtn);
    } else {
        document.getElementById("description-display").innerHTML = `本番模擬（Actual）形式で一括採点を行います。<br>制限時間（${appConfig.timeLimit}分）内に全問解答してください。`;
    }
};

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function startExam() {
    document.getElementById('start-container').style.display = 'none';
    document.getElementById('exam-container').style.display = 'flex';
    examStartTime = Date.now();
    
    let allQuestions = JSON.parse(JSON.stringify(originalQuizData));
    if (appConfig.mode === "practice") {
        const selectedCategory = document.getElementById("category-select").value;
        if (selectedCategory !== "all") {
            allQuestions = allQuestions.filter(q => (q.category ? q.category.toString() : "未分類") === selectedCategory);
        }
    }
    
    shuffle(allQuestions);
    const countSelect = document.getElementById("question-count-select").value;
    let targetCount = allQuestions.length;
    if (countSelect !== "all") {
        targetCount = Math.min(parseInt(countSelect), allQuestions.length);
    }
    
    quizData = allQuestions.slice(0, targetCount);
    quizData.forEach(q => { shuffle(q.options); });

    if (appConfig.mode === "mock") {
        buildPalette();
        timeRemaining = appConfig.timeLimit * 60;
        startExamTimer();
    }
    
    qStartTime = Date.now();
    loadQuestion();
}

function buildPalette() {
    const grid = document.getElementById('palette-grid');
    grid.innerHTML = '';
    quizData.forEach((_, index) => {
        const item = document.createElement('div');
        item.className = 'palette-item';
        item.id = `palette-${index}`;
        item.innerText = index + 1;
        item.onclick = () => jumpToQuestion(index);
        grid.appendChild(item);
    });
}

function updatePaletteStatus() {
    if (appConfig.mode !== "mock") return;
    quizData.forEach((_, index) => {
        const item = document.getElementById(`palette-${index}`);
        if (!item) return;
        item.className = 'palette-item';
        if (index === currentQuestionIndex) item.classList.add('current');
        if (userAnswers[index] !== undefined && userAnswers[index].selectedOption !== null) item.classList.add('answered');
        if (flaggedQuestions[index]) item.classList.add('flagged');
    });
}

function loadQuestion() {
    if (quizData.length === 0) return;
    const currentQuestion = quizData[currentQuestionIndex];
    document.getElementById('progress').innerText = `問題 ${currentQuestionIndex + 1} / ${quizData.length}`;
    document.getElementById('category-display').innerText = `${currentQuestion.category || "未分類"}`;
    document.getElementById('question-text').innerHTML = formatText(currentQuestion.question);
    
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';
    optionsContainer.className = `options layout-${appConfig.layout || 'normal'}`;
    
    const confPanel = document.getElementById("confidence-panel");
    const feedbackPanel = document.getElementById("instant-feedback");
    
    confPanel.style.display = "none";
    feedbackPanel.style.display = "none";
    feedbackPanel.innerHTML = "";
    
    const ansObj = userAnswers[currentQuestionIndex] || { selectedOption: null, elapsedTimeMs: 0, confidence: "NULL", isConfirmed: false, answerTimestamp: null };
    const currentSelectedIdx = ansObj.selectedOption;
    const correctOption = currentQuestion.options.find(o => o.isCorrect);

    currentQuestion.options.forEach((option, index) => {
        const button = document.createElement('button');
        button.className = 'option-btn';
        button.innerHTML = `<span class="option-num">${index + 1}</span><div class="option-text">${formatText(option.text)}</div>`;
        
        if (appConfig.mode === "mock") {
            if (currentSelectedIdx === index) button.classList.add('selected');
            button.onclick = () => selectOption(index);
        } else {
            if (ansObj.isConfirmed) {
                if (option.isCorrect) button.classList.add('correct');
                if (currentSelectedIdx === index && !option.isCorrect) button.classList.add('incorrect');
                button.disabled = true;
            } else {
                if (currentSelectedIdx === index) button.classList.add('selected');
                button.onclick = () => selectOption(index);
            }
        }
        optionsContainer.appendChild(button);
    });

    if (appConfig.mode === "practice") {
        if (currentSelectedIdx !== null && !ansObj.isConfirmed) {
            confPanel.style.display = "block";
        } else if (ansObj.isConfirmed) {
            const selectedOption = currentQuestion.options[currentSelectedIdx];
            const isCorrect = selectedOption ? selectedOption.isCorrect : false;
            const sec = (ansObj.elapsedTimeMs / 1000).toFixed(1);
            feedbackPanel.style.display = "block";
            feedbackPanel.innerHTML = `<strong>${isCorrect ? "◯ 正解！" : "✕ 不正解..."} (回答時間: ${sec}秒 / 自信度: ${ansObj.confidence})</strong><br><br><strong>解説:</strong><br>${correctOption ? formatText(correctOption.rationale) : "解説はありません。"}`;
        }
    }

    const flagBtn = document.getElementById('flag-button');
    if (flagBtn) {
        if (flaggedQuestions[currentQuestionIndex]) {
            flagBtn.classList.add('flagged');
        } else {
            flagBtn.classList.remove('flagged');
        }
    }
    updatePaletteStatus();
}

function selectOption(selectedIndex) {
    if (!userAnswers[currentQuestionIndex]) {
        userAnswers[currentQuestionIndex] = { selectedOption: null, elapsedTimeMs: 0, confidence: "NULL", isConfirmed: false, answerTimestamp: null };
    }
    userAnswers[currentQuestionIndex].selectedOption = selectedIndex;
    userAnswers[currentQuestionIndex].answerTimestamp = new Date().toISOString();

    if (appConfig.mode === "mock") {
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, idx) => {
            if (idx === selectedIndex) btn.classList.add('selected');
            else btn.classList.remove('selected');
        });
        updatePaletteStatus();
    } else {
        loadQuestion();
    }
}

function selectConfidence(level) {
    if (!userAnswers[currentQuestionIndex]) {
        userAnswers[currentQuestionIndex] = { selectedOption: null, elapsedTimeMs: 0, confidence: "NULL", isConfirmed: false, answerTimestamp: null };
    }
    
    const elapsedMs = Date.now() - qStartTime;
    userAnswers[currentQuestionIndex].elapsedTimeMs += elapsedMs;
    userAnswers[currentQuestionIndex].confidence = level;
    userAnswers[currentQuestionIndex].isConfirmed = true;
    userAnswers[currentQuestionIndex].answerTimestamp = new Date().toISOString();
    
    loadQuestion();
}

function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function nextQuestion() { 
    if (currentQuestionIndex < quizData.length - 1) { 
        updateElapsedTimeForCurrentQuestion();
        currentQuestionIndex++;
        qStartTime = Date.now();
        loadQuestion(); 
        scrollToTop();
    } 
}

function prevQuestion() { 
    if (currentQuestionIndex > 0) { 
        updateElapsedTimeForCurrentQuestion();
        currentQuestionIndex--;
        qStartTime = Date.now();
        loadQuestion(); 
        scrollToTop();
    } 
}

function jumpToQuestion(index) { 
    updateElapsedTimeForCurrentQuestion();
    currentQuestionIndex = index; 
    qStartTime = Date.now();
    loadQuestion(); 
    scrollToTop();
}

function toggleFlag() {
    flaggedQuestions[currentQuestionIndex] = !flaggedQuestions[currentQuestionIndex];
    loadQuestion();
}

function submitExam(isAuto = false) {
    updateElapsedTimeForCurrentQuestion();

    if (!isAuto) {
        const unansweredCount = quizData.filter((_, idx) => !userAnswers[idx] || userAnswers[idx].selectedOption === null || (appConfig.mode === "practice" && !userAnswers[idx].isConfirmed)).length;
        let confirmMessage = "演習を終了して採点を行いますか？";
        if (unansweredCount > 0) {
            confirmMessage = `まだ未完了（未選択または自信度未回答）の問題が ${unansweredCount} 問あります。\n本当に演習を終了して採点を行いますか？`;
        }
        if (!confirm(confirmMessage)) return;
    }

    if (timerInterval) clearInterval(timerInterval);
    
    examEndTime = Date.now();
    const totalElapsedMs = examEndTime - examStartTime;
    const totalSeconds = Math.floor(totalElapsedMs / 1000);
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    const totalTimeStr = `${minutes}分${seconds}秒`;

    document.getElementById('exam-container').style.display = 'none';
    document.getElementById('score-container').style.display = 'block';
    
    let finalScore = 0;
    let catStats = {};
    
    rawLogArray = [];
    const sessionId = "SESS_" + Date.now();
    const dateTimeStr = new Date().toLocaleString();

    const reviewList = document.getElementById('review-list');
    reviewList.innerHTML = '';

    quizData.forEach((question, idx) => {
        const categoryName = question.category ? question.category.toString() : "未分類";
        if (!catStats[categoryName]) catStats[categoryName] = { total: 0, correct: 0 };
        catStats[categoryName].total++;

        const ansObj = userAnswers[idx] || { selectedOption: null, elapsedTimeMs: 0, confidence: "NULL", isConfirmed: false, answerTimestamp: new Date().toISOString() };
        const selectedIdx = ansObj.selectedOption;
        const correctOption = question.options.find(o => o.isCorrect);
        const selectedOption = selectedIdx !== null ? question.options[selectedIdx] : null;
        const isCorrect = selectedOption ? selectedOption.isCorrect : false;
        const secStr = (ansObj.elapsedTimeMs / 1000).toFixed(1);
        
        if (isCorrect) {
            finalScore++;
            catStats[categoryName].correct++;
        }

        rawLogArray.push({
            logId: "LOG_" + Date.now() + "_" + (idx + 1),
            sessionId: sessionId,
            questionOrder: idx + 1,
            questionId: question.id,
            answer: selectedIdx !== null ? (selectedIdx + 1).toString() : "未回答",
            correct: isCorrect ? "TRUE" : "FALSE",
            responseTimeMs: ansObj.elapsedTimeMs,
            answerTimeSec: parseFloat(secStr),
            confidence: ansObj.confidence,
            explanationComprehension: "NULL",
            review: "FALSE",
            answerTime: ansObj.answerTimestamp || new Date().toISOString(),
            studentId: "STU-00123",
            mode: appConfig.mode === "practice" ? "Drill" : "Actual",
            category: categoryName
        });

        const item = document.createElement('div');
        item.className = 'review-item';
        item.id = `review-item-${idx}`;
        const statusClass = isCorrect ? 'review-status-correct' : 'review-status-incorrect';
        const statusText = isCorrect ? '【正解】' : (selectedIdx === null ? '【未回答】' : '【不正解】');
        
        item.innerHTML = `
            <div class="review-q">Q${idx + 1}. ${formatText(question.question)} <span class="${statusClass}">${statusText}</span></div>
            <div class="review-ans">あなたの回答: <strong>${selectedOption ? formatText(selectedOption.text) : '（未回答）'}</strong> (思考時間: ${secStr}秒) ${appConfig.mode === "practice" ? `[自信度: ${ansObj.confidence}]` : ''}</div>
            ${!isCorrect && correctOption ? `<div class="review-ans" style="color: #2b6cb0;">正しい解答: <strong>${formatText(correctOption.text)}</strong></div>` : ''}
            <div style="margin: 10px 0; padding: 6px; background: #f0fdf4; border-radius: 4px; display: inline-block;">
                <label style="cursor: pointer; font-size: 14px; color: #166534; font-weight: bold;">
                    <input type="checkbox" class="review-flag-cb" data-idx="${idx}" onchange="syncReviewFlag(this)"> 🚩 この問題を後でもう一度解く (Review Flag)
                </label>
            </div>
            <div class="review-rationale">
                <strong>正解の解説:</strong><br>${correctOption ? formatText(correctOption.rationale) : '解説はありません。'}
                
                <div style="margin-top: 12px; padding-top: 8px; border-top: 1px dashed #cbd5e1; font-size: 13px;">
                    <span style="font-weight: bold; color: #475569; margin-right: 8px;">解説の理解度:</span>
                    <button type="button" class="comp-btn" id="comp-btn-${idx}-3" onclick="setComprehension(${idx}, '3')">3. 理解できた</button>
                    <button type="button" class="comp-btn" id="comp-btn-${idx}-2" onclick="setComprehension(${idx}, '2')">2. だいたい理解できた</button>
                    <button type="button" class="comp-btn" id="comp-btn-${idx}-1" onclick="setComprehension(${idx}, '1')">1. まだ少し分からない</button>
                    <button type="button" class="comp-btn" id="comp-btn-${idx}-0" onclick="setComprehension(${idx}, '0')">0. 全然分からない</button>
                    <span class="comp-warning-tag" id="comp-warn-${idx}">⚠️ 理解度が未選択です</span>
                </div>
            </div>
        `;
        reviewList.appendChild(item);
    });

    document.getElementById('final-score').innerText = `${finalScore} / ${quizData.length} 問正解`;
    const scorePercent = quizData.length > 0 ? Math.round((finalScore / quizData.length) * 100) : 0;
    const modeLabel = appConfig.mode === "mock" ? "模擬試験" : "練習ドリル";
    
    reportBaseText = `演習モード: ${modeLabel}\n実施日時: ${dateTimeStr}\n総実施時間: ${totalTimeStr}\n総合スコア: ${scorePercent}点\n\n■ カテゴリ別正解率\n`;
    for (let cat in catStats) {
        let rate = catStats[cat].total > 0 ? Math.round((catStats[cat].correct / catStats[cat].total) * 100) : 0;
        reportBaseText += `· ${cat}: ${rate}% (${catStats[cat].correct}/${catStats[cat].total})\n`;
    }

    actualSummary = {
        sessionId: sessionId,
        studentId: "STU-00123",
        mode: appConfig.mode === "practice" ? "Drill" : "Actual",
        startTime: new Date(examStartTime).toISOString(),
        endTime: new Date(examEndTime).toISOString(),
        totalTimeSec: Math.floor(totalElapsedMs / 1000),
        questionCount: quizData.length,
        score: finalScore,
        correctCount: finalScore,
        wrongCount: quizData.length - finalScore,
        accuracy: scorePercent
    };
}

function syncReviewFlag(checkbox) {
    const idx = parseInt(checkbox.getAttribute('data-idx'));
    if (rawLogArray[idx]) {
        rawLogArray[idx].review = checkbox.checked ? "TRUE" : "FALSE";
    }
}

function setComprehension(idx, level) {
    if (!rawLogArray[idx]) return;

    const strLevel = String(level);
    if (rawLogArray[idx].explanationComprehension === strLevel) {
        rawLogArray[idx].explanationComprehension = "NULL";
    } else {
        rawLogArray[idx].explanationComprehension = strLevel;
    }

    [0, 1, 2, 3].forEach(v => {
        const btn = document.getElementById(`comp-btn-${idx}-${v}`);
        if (btn) {
            if (rawLogArray[idx].explanationComprehension === String(v)) {
                btn.classList.add('selected');
            } else {
                btn.classList.remove('selected');
            }
        }
    });

    const reviewItem = document.getElementById(`review-item-${idx}`);
    const warnTag = document.getElementById(`comp-warn-${idx}`);
    if (reviewItem && warnTag) {
        if (rawLogArray[idx].explanationComprehension !== "NULL") {
            reviewItem.classList.remove('unentered-comprehension');
            warnTag.style.display = "none";
        }
    }
}

async function finalizeAndGenerateReport() {
    const unenteredIndices = [];
    rawLogArray.forEach((item, idx) => {
        const reviewItem = document.getElementById(`review-item-${idx}`);
        const warnTag = document.getElementById(`comp-warn-${idx}`);
        
        if (item.explanationComprehension === "NULL") {
            unenteredIndices.push(idx + 1);
            if (reviewItem) reviewItem.classList.add('unentered-comprehension');
            if (warnTag) warnTag.style.display = "inline";
        } else {
            if (reviewItem) reviewItem.classList.remove('unentered-comprehension');
            if (warnTag) warnTag.style.display = "none";
        }
    });

    if (unenteredIndices.length > 0) {
        const qListStr = unenteredIndices.join(", ");
        const proceed = confirm(
            `【未入力の確認】\n以下の設問で「解説の理解度」が未選択です。\n\n対象: 問 ${qListStr}\n\nこのまま未入力の状態で確定・生成しますか？\n（[キャンセル] を押すと未入力の設問へ移動します）`
        );

        if (!proceed) {
            const firstUnenteredIdx = unenteredIndices[0] - 1;
            const targetElem = document.getElementById(`review-item-${firstUnenteredIdx}`);
            if (targetElem) {
                targetElem.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            showToast(`問 ${unenteredIndices[0]} の解説理解度を選択してください。`);
            return;
        }
    }

    buildReportPayloadText();
    document.getElementById("output-section").style.display = "block";
    showToast("レポートとログデータを確定・生成しました。");

    document.getElementById("output-section").scrollIntoView({ behavior: 'smooth' });
}

function buildReportPayloadText() {
    let finalPayload = `あなたは優秀なAIメンターです。以下に添付した私のCBT結果ログを、各設問の「正誤」「回答時間（思考時間）」「自信度」「解説の理解度」「出題順（集中力傾向）」の相関を含めて深く多角的に分析し、以下の3点を行ってください。\n\n`;
    finalPayload += `【対応依頼】\n`;
    finalPayload += `1. 私の理解のボトルネックや傾向を客観的に品評してください。単なる正誤だけでなく、「時間をかけたのに間違えた深刻な課題」や「解説を読んでも理解できていない（理解度0〜1）の項目」を抽出・整理してください。\n`;
    finalPayload += `2. 私が間違えた問題、および解説理解度が低く（0〜1）理解が不十分な問題の解説を、専門用語の補足を含めてさらに噛み砕いてCanvas上でレビューしてください。\n`;
    finalPayload += `3. 私の弱点傾向を分析し、その克服に最適な新しい類似問題を3問作成し、私が回答できるようにCanvas上で出題してください。\n\n`;
    
    let reportDetails = "";
    rawLogArray.forEach((item, idx) => {
        const q = quizData[idx];
        const compMap = { "3": "3 (理解できた)", "2": "2 (だいたい理解できた)", "1": "1 (まだ少し分からない)", "0": "0 (全然分からない)", "NULL": "未入力" };
        
        reportDetails += `[問${idx + 1}] ${item.correct === "TRUE" ? "◯ 正解" : "✕ 不正解"}\n`;
        reportDetails += `・カテゴリ: ${item.category}\n`;
        reportDetails += `・問題文: ${q.question}\n`;
        reportDetails += `・回答時間: ${item.answerTimeSec}秒\n`;
        if (appConfig.mode === "practice") {
            reportDetails += `・自信度: ${item.confidence}\n`;
        }
        reportDetails += `・解説理解度: ${compMap[item.explanationComprehension] || "未入力"}\n`;
        reportDetails += `・要復習フラグ: ${item.review}\n\n`;
    });

    finalPayload += `--- 以下、解答レポート ---\n` + reportBaseText + `\n■ 各問題の演習詳細\n` + reportDetails;
    finalPayload += `\n\n=== SUMMARY_LOG ===\n${JSON.stringify(actualSummary)}`;
    finalPayload += `\n\n=== DRILL_RAW_LOG ===\n${JSON.stringify(rawLogArray)}`;
    
    document.getElementById('report-text').value = finalPayload;
}

function copyReport() {
    const txt = document.getElementById("report-text");
    txt.select();
    document.execCommand("copy");
    showToast("レポートをクリップボードにコピーしました。");
}

function downloadFile(content, fileName, mimeType) {
    const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
    const blob = new Blob([bom, content], { type: mimeType });
    const link = document.createElement("a");
    
    if (navigator.msSaveBlob) { 
        navigator.msSaveBlob(blob, fileName);
    } else {
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", fileName);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
}

function downloadExcelCSV() {
    if (rawLogArray.length === 0) return;
    
    let csvContent = "";
    csvContent += "=== Session_Summary (試験サマリー) ===\r\n";
    csvContent += "Session ID,Student ID,Mode,Start Time,End Time,Total Time (sec),Question Count,Score,Correct Count,Wrong Count,Accuracy\r\n";
    csvContent += `"${actualSummary.sessionId}","${actualSummary.studentId}","${actualSummary.mode}","${actualSummary.startTime}","${actualSummary.endTime}",${actualSummary.totalTimeSec},${actualSummary.questionCount},${actualSummary.score},${actualSummary.correctCount},${actualSummary.wrongCount},"${actualSummary.accuracy}%"\r\n\r\n`;
    
    csvContent += "=== Answer_Log (問題単位詳細) ===\r\n";
    csvContent += "Log ID,Session ID,Question Order,Question ID,Answer,Correct,Response Time (ms),Confidence,ExplanationComprehension,Review,Answer Time\r\n";
    
    rawLogArray.forEach(item => {
        csvContent += `"${item.logId}","${item.sessionId}",${item.questionOrder},"${item.questionId}","${item.answer}",${item.correct},${item.responseTimeMs},${item.confidence === 'NULL' ? '' : item.confidence},${item.explanationComprehension === 'NULL' ? '' : item.explanationComprehension},"${item.review}","${item.answerTime}"\r\n`;
    });
    
    downloadFile(csvContent, `CBT_LOG_${actualSummary.sessionId}.csv`, "text/csv;charset=utf-8;");
    showToast("Excel/GAS対応の統合ログファイルをダウンロードしました。");
}

function downloadRDBAnswerLogCSV() {
    if (rawLogArray.length === 0) return;
    
    let csvContent = "LogID,SessionID,QuestionOrder,QuestionID,Answer,Correct,ResponseTime,ConfidenceLevel,ExplanationComprehension,Review,AnswerTime\r\n";
    rawLogArray.forEach(item => {
        csvContent += `"${item.logId}","${item.sessionId}",${item.questionOrder},"${item.questionId}","${item.answer}",${item.correct},${item.responseTimeMs},${item.confidence === 'NULL' ? '' : item.confidence},${item.explanationComprehension === 'NULL' ? '' : item.explanationComprehension},"${item.review}","${item.answerTime}"\r\n`;
    });
    
    downloadFile(csvContent, `AnswerLog_${actualSummary.sessionId}.csv`, "text/csv;charset=utf-8;");
    showToast("RDB用 AnswerLog.csv をダウンロードしました。");
}

function downloadRDBSessionLogCSV() {
    if (!actualSummary.sessionId) return;
    
    let csvContent = "SessionID,StudentID,Mode,StartTime,EndTime,TotalTime,QuestionCount\r\n";
    csvContent += `"${actualSummary.sessionId}","${actualSummary.studentId}","${actualSummary.mode}","${actualSummary.startTime}","${actualSummary.endTime}",${actualSummary.totalTimeSec},${actualSummary.questionCount}\r\n`;
    
    downloadFile(csvContent, `SessionLog_${actualSummary.sessionId}.csv`, "text/csv;charset=utf-8;");
    showToast("RDB用 SessionLog.csv をダウンロードしました。");
}
